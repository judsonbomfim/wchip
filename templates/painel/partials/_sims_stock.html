{% load static i18n %}
{# Paleta: SIM #3b82f6 | eSIM #14b8a6 — ícones 22px no círculo 40px #}
<div class="grid xl:grid-cols-4 md:grid-cols-2 grid-cols-1 gap-base mb-5">
  <div class="card">
    <div class="card-body">
      <h5 class="mb-4 uppercase">T-Mobile</h5>
      <div class="grid grid-cols-2 gap-3">
        <div class="flex items-center gap-2.5">
          <span class="stock-chip stock-chip--sim">
            <span class="stock-chip__icon" aria-hidden="true"></span>
          </span>
          <div class="min-w-0">
            <p class="mb-0 text-xl text-default-800 leading-tight"><span data-target="{{ sim_tm|default:0 }}">0</span></p>
            <p class="mb-0 text-xs font-medium text-default-400">SIMs</p>
          </div>
        </div>
        <div class="flex items-center gap-2.5">
          <span class="stock-chip stock-chip--esim">
            <span class="stock-chip__icon" aria-hidden="true"></span>
          </span>
          <div class="min-w-0">
            <p class="mb-0 text-xl text-default-800 leading-tight"><span data-target="{{ esim_tm|default:0 }}">0</span></p>
            <p class="mb-0 text-xs font-medium text-default-400">eSIMs</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-body">
      <h5 class="mb-4 uppercase">CMHK</h5>
      <div class="grid grid-cols-2 gap-3">
        <div class="flex items-center gap-2.5">
          <span class="stock-chip stock-chip--sim">
            <span class="stock-chip__icon" aria-hidden="true"></span>
          </span>
          <div class="min-w-0">
            <p class="mb-0 text-xl text-default-800 leading-tight"><span data-target="{{ sim_cmhk|default:0 }}">0</span></p>
            <p class="mb-0 text-xs font-medium text-default-400">SIMs</p>
          </div>
        </div>
        <div class="flex items-center gap-2.5">
          <span class="stock-chip stock-chip--esim">
            <span class="stock-chip__icon" aria-hidden="true"></span>
          </span>
          <div class="min-w-0">
            <p class="mb-0 text-xl text-default-800 leading-tight"><span data-target="{{ esim_cmhk|default:0 }}">0</span></p>
            <p class="mb-0 text-xs font-medium text-default-400">eSIMs</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
