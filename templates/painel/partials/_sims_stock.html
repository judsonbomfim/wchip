{% load static i18n iconify_icons %}
{# Paleta: SIM #3b82f6 | eSIM #14b8a6 #}
{# Ícones via data-URI (icon_svg) — evita CORS do CDN com mask-image #}
<div class="grid xl:grid-cols-4 md:grid-cols-2 grid-cols-1 gap-base mb-5">
  <div class="card">
    <div class="card-body">
      <h5 class="mb-4 uppercase">T-Mobile</h5>
      <div class="grid grid-cols-2 gap-3">
        <div class="flex items-center gap-2.5">
          <span class="size-10 shrink-0 flex justify-center items-center rounded-full"
                style="background-color: rgba(59, 130, 246, 0.15);
                       color: #3b82f6">
            <i class="iconify"
               style="--svg: {% icon_svg 'painel/inspina/icons/sim-card.svg' %};
                      width: 22px;
                      height: 22px"
               aria-hidden="true"></i>
          </span>
          <div class="min-w-0">
            <p class="mb-0 text-xl text-default-800 leading-tight"><span data-target="{{ sim_tm|default:0 }}">0</span></p>
            <p class="mb-0 text-xs font-medium text-default-400">SIMs</p>
          </div>
        </div>
        <div class="flex items-center gap-2.5">
          <span class="size-10 shrink-0 flex justify-center items-center rounded-full"
                style="background-color: rgba(20, 184, 166, 0.15);

            <p class="mb-0 text-xs font-medium text-default-400">eSIMs</p>
          </div>
        </div>
      </div>
    </div>
