# Referência local — produção usa argumentos inline no docker-compose.yml
# (evita bind-mount ./redis.conf no Portainer, que costuma quebrar o deploy).
#
# REDIS_PASSWORD no .env do host (ENV_FILE_PATH): opcional; se vazio, Redis sobe sem senha
# na rede wchip_internal (internal: true, porta não publicada no host).
port 6379
bind 0.0.0.0
protected-mode yes
dir /data
pidfile ""
