x-app-common: &app-common
  image: ${IMAGE_NAME:-djangoweb:latest}
  environment:
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    DEBUG: ${DEBUG:-False}
    COLLECTSTATIC_ON_STARTUP: ${COLLECTSTATIC_ON_STARTUP:-false}
  volumes:
    - logs:/djangoweb/logs
    # Servidor: .env de produção (no repo o conteúdo está em .env.production; .env da raiz é só local)
    - ${ENV_FILE_PATH:-/home/sprdmntrdr/docker/django/.env}:/djangoweb/.env:ro
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  restart: unless-stopped

services:
  web:
    <<: *app-common
    container_name: wchip-web
    build:
      context: .
      dockerfile: Dockerfile
    command: ["web"]
    networks:
      - public
      - shared_backend
      - wchip_internal
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DEBUG: ${DEBUG:-False}
      COLLECTSTATIC_ON_STARTUP: ${COLLECTSTATIC_ON_STARTUP:-false}
      IMAGE_NAME: ${IMAGE_NAME:-djangoweb:latest}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=public"
      - "traefik.http.routers.django-http.rule=Host(`${DOMAIN:-painel.worldchip.com.br}`)"
      - "traefik.http.routers.django-http.entrypoints=web"
      - "traefik.http.routers.django-http.middlewares=https-redirect"
      - "traefik.http.routers.django-https.rule=Host(`${DOMAIN:-painel.worldchip.com.br}`)"
      - "traefik.http.routers.django-https.entrypoints=websecure"
      - "traefik.http.routers.django-https.tls=true"
      - "traefik.http.routers.django-https.tls.certresolver=leresolver"
      - "traefik.http.services.django.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

  celery:
    <<: *app-common
    container_name: wchip-celery
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A core worker --loglevel=info --concurrency=8 --max-tasks-per-child=50
    networks:
      - shared_backend
      - wchip_internal
    mem_limit: 4g
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  # Nunca escalar celery_beat: um único processo evita disparos duplicados.
  celery_beat:
    <<: *app-common
    container_name: wchip-celery-beat
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - python manage.py sync_celery_beat && celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - shared_backend
      - wchip_internal
    mem_limit: 512m
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  redis:
    container_name: wchip-redis
    image: redis:7.2.16-alpine
    networks:
      - wchip_internal
    # Senha e demais secrets: mesmo .env montado no Django (ENV_FILE_PATH).
    env_file:
      - path: ${ENV_FILE_PATH:-/home/sprdmntrdr/docker/django/.env}
        required: false
    volumes:
      - redis-data:/data
    command:
      - sh
      - -c
      - |
        set -e
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --port 6379 --bind 0.0.0.0 --protected-mode yes --dir /data --pidfile "" --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --port 6379 --bind 0.0.0.0 --protected-mode yes --dir /data --pidfile ""
        fi
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping; else redis-cli ping; fi | grep -q PONG",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  public:
    external: true
    name: public
  shared_backend:
    external: true
    name: shared_backend
  wchip_internal:
    driver: bridge
    internal: true

volumes:
  redis-data:
    driver: local
  logs:
    driver: local
