x-app-common: &app-common
  image: ${IMAGE_NAME:-djangoweb:latest}
  environment:
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    DEBUG: ${DEBUG:-False}
    COLLECTSTATIC_ON_STARTUP: ${COLLECTSTATIC_ON_STARTUP:-false}
  volumes:
    - logs:/djangoweb/logs
    # Servidor: .env de produção (no repo o conteúdo está em .env.production; .env da raiz é só local)
    - ${ENV_FILE_PATH:-/home/sprdmntrdr/docker/django/.env}:/djangoweb/.env:ro
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  restart: unless-stopped

services:
  # Volume logs costuma ficar root:root após deploys antigos; app roda como duser (uid 10001).
  logs-init:
    container_name: wchip-logs-init
    image: alpine:3.20
    volumes:
      - logs:/logs
    command: ["sh", "-c", "chown -R 10001:10001 /logs && chmod -R u+rwX /logs"]
    restart: "no"

  web:
    <<: *app-common
    container_name: wchip-web
    build:
      context: .
      dockerfile: Dockerfile
    command: ["web"]
    networks:
      - public
      - shared_backend
      - wchip_internal
    depends_on:
      logs-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DEBUG: ${DEBUG:-False}
      COLLECTSTATIC_ON_STARTUP: ${COLLECTSTATIC_ON_STARTUP:-false}
      IMAGE_NAME: ${IMAGE_NAME:-djangoweb:latest}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=public"
      - "traefik.http.routers.django-http.rule=Host(`${DOMAIN:-painel.worldchip.com.br}`)"
      - "traefik.http.routers.django-http.entrypoints=web"
      - "traefik.http.routers.django-http.middlewares=https-redirect"
      - "traefik.http.routers.django-https.rule=Host(`${DOMAIN:-painel.worldchip.com.br}`)"
      - "traefik.http.routers.django-https.entrypoints=websecure"
      - "traefik.http.routers.django-https.tls=true"
      - "traefik.http.routers.django-https.tls.certresolver=leresolver"
      - "traefik.http.services.django.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

  celery:
    <<: *app-common
    container_name: wchip-celery
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A core worker --loglevel=info --concurrency=8 --max-tasks-per-child=50
    networks:
      - shared_backend
      - wchip_internal
    mem_limit: 4g
    depends_on:
      logs-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      web:
        condition: service_started

  # Nunca escalar celery_beat: um único processo evita disparos duplicados.
  celery_beat:
    <<: *app-common
    container_name: wchip-celery-beat
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - python manage.py sync_celery_beat && celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - shared_backend
      - wchip_internal
    mem_limit: 512m
    depends_on:
      logs-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      web:
        condition: service_started

  redis:
    container_name: wchip-redis
    image: redis:7.2.16-alpine
    networks:
      - wchip_internal
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    restart: unless-stopped

networks:
  public:
    external: true
    name: public
  shared_backend:
    external: true
    name: shared_backend
  wchip_internal:
    driver: bridge
    internal: true

volumes:
  redis-data:
    driver: local
  logs:
    driver: local
